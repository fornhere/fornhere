<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Forn</title>
  <desc id="d">Ajan "bitti" der, ben kanıt isterim. An agent saying "done" is a claim, not proof. Bir ajan çıktısı kapıdan geçer: ilk deneme reddedilir, ikincisi doğrulanır.</desc>
  <style>
  .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}
  .tx{fill:#e6edf3;}
  .mu{fill:#8b949e;}
  .ac{fill:#ffb000;}
  .ink{fill:#0b0f14;}

  .cur{animation:blink 1.1s steps(1,end) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  .scan{animation:scan 3.2s ease-in-out infinite alternate;}
  @keyframes scan{from{transform:translateY(-62px)}to{transform:translateY(62px)}}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
</style>
  <defs>
    <pattern id="gp" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e6edf3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <linearGradient id="gmg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0.15"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="gm"><rect width="1200" height="300" fill="url(#gmg)"/></mask>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ffb000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <clipPath id="gc"><rect x="906" y="74" width="44" height="156"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="#0b0f14" stroke="#262c36"/>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#gp)" mask="url(#gm)"/>

  <!-- sol: kimlik -->
  <text x="56" y="70" class="m mu" font-size="17">~ <tspan class="ac">$</tspan> whoami</text>
  <text x="50" y="158" class="m tx" font-size="92" font-weight="700" letter-spacing="-3">Forn<tspan class="ac cur">_</tspan></text>
  <text x="56" y="208" class="s tx" font-size="29" font-weight="700" letter-spacing="-0.4">Ajan <tspan class="ac">“bitti”</tspan> der, ben <tspan class="ac">kanıt</tspan> isterim.</text>
  <text x="56" y="246" class="m mu" font-size="19">An agent saying "done" is a claim, not proof.</text>

  <!-- sağ: ajan -> kapı -> damga -->
  <rect x="684" y="128" width="176" height="46" rx="8" fill="#121821" stroke="#30363d"/>
  <text x="772.0" y="157" text-anchor="middle" class="m tx" font-size="16"><tspan class="mu">agent:</tspan> done ✓?</text>
  <text x="686" y="116" class="m mu" font-size="14" letter-spacing="1.5">CLAIM</text>
  <line x1="866" y1="152.0" x2="894" y2="152.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- kapı -->
  <rect x="902" y="74" width="52" height="156" rx="4" fill="#ffb000" fill-opacity="0.10"/>
  <rect x="902" y="74" width="5" height="156" rx="2" fill="#ffb000"/>
  <rect x="949" y="74" width="5" height="156" rx="2" fill="#ffb000"/>
  <g clip-path="url(#gc)"><rect class="scan" x="906" y="150.5" width="44" height="3" fill="#ffb000"/></g>
  <text x="928.0" y="60" text-anchor="middle" class="m ac" font-size="14" font-weight="700" letter-spacing="3">GATE</text>
  <text x="928.0" y="254" text-anchor="middle" class="m mu" font-size="14" letter-spacing="1.5">kapı</text>

  <line x1="962" y1="122.0" x2="982" y2="114.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="962" y1="164.0" x2="982" y2="178.0" stroke="#ffb000" stroke-width="1.8" marker-end="url(#aa)"/>

  <!-- damgalar -->
  <g>
    <rect x="990" y="90.0" width="158" height="40" rx="6" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="1069" y="116.0" text-anchor="middle" class="m mu" font-size="17" font-weight="700" letter-spacing="1">✗ REJECTED</text>
  </g>
  <text x="992" y="80.0" class="m mu" font-size="14" letter-spacing="0.5">#1 · no proof</text>
  <g>
    <g transform="rotate(-3 1070 182.0)">
      <rect x="990" y="160.0" width="160" height="46" rx="6" fill="#ffb000"/>
      <text x="1070" y="190.0" text-anchor="middle" class="m ink" font-size="19" font-weight="700" letter-spacing="1">✓ VERIFIED</text>
    </g>
  </g>
  <text x="992" y="230.0" class="m mu" font-size="14" letter-spacing="0.5">#2 · proof attached</text>

  <!-- yeniden dene döngüsü: red -> ajan -->
  <path d="M1069 62.0 V44 H772.0 V98" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="920.5" y="36" text-anchor="middle" class="m mu" font-size="14" letter-spacing="0.5">yeniden dene · retry</text>
</svg>
