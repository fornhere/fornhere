<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Orvant</title>
  <desc id="d">Your coding agent says "done". Orvant asks for proof. Akış: karşılama, mimar, kehanet, yürütme, kapı (geçer/kalır), teşhis; teşhisten yeniden dene veya yeniden planla. 0.1.0b1, open beta, MIT.</desc>
  <style>
  .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;}
  .tx{fill:#1f2328;}
  .mu{fill:#59636e;}
  .ac{fill:#b45309;}
  .ink{fill:#ffffff;}

  .gx{animation:gx 4s ease-in-out infinite;}
  .gv{animation:gv 4s ease-in-out infinite;}
  @keyframes gx{0%,40%{opacity:1}50%,90%{opacity:.25}100%{opacity:1}}
  @keyframes gv{0%,40%{opacity:.25}50%,90%{opacity:1}100%{opacity:.25}}
  .march{animation:march 1.8s linear infinite;}
  @keyframes march{to{stroke-dashoffset:-18}}
  .cur{animation:blink 1.1s steps(1,end) infinite;}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
</style>
